[package]
name = "crush-circuit"
description = "crush circuit extension"
version.workspace = true
edition.workspace = true

[dependencies]
openvm-stark-backend = { workspace = true }
openvm-stark-sdk = { workspace = true, optional = true }
openvm-cuda-backend = { workspace = true, optional = true }
openvm-cuda-common = { workspace = true, optional = true }
openvm-circuit-primitives = { workspace = true }
openvm-circuit-primitives-derive = { workspace = true }
openvm-circuit = { workspace = true }
openvm-circuit-derive = { workspace = true }
openvm-instructions = { workspace = true }
openvm-sdk = { workspace = true }
openvm-sdk-config = { workspace = true }
openvm-cpu-backend = { workspace = true }
openvm-rv32im-transpiler = { workspace = true }
openvm-rv32im-circuit = { workspace = true }
openvm-rv32-adapters = { workspace = true }
openvm-mod-circuit-builder = { workspace = true }
openvm-algebra-circuit = { workspace = true }
openvm-algebra-guest = { workspace = true }
num-bigint = { workspace = true, features = ["serde"] }
num-traits.workspace = true
openvm-algebra-transpiler.workspace = true
openvm-ecc-circuit.workspace = true
openvm-ecc-guest.workspace = true
openvm-ecc-transpiler.workspace = true
openvm-pairing-guest.workspace = true
openvm-pairing-transpiler.workspace = true
halo2curves-axiom.workspace = true
blstrs = { workspace = true, features = ["__private_bench"] }
once_cell.workspace = true
lazy_static.workspace = true
hex-literal.workspace = true
serde_with.workspace = true
openvm-transpiler = { workspace = true }
openvm-crush-transpiler = { workspace = true }
strum.workspace = true
derive-new.workspace = true
derive_more = { workspace = true, features = ["from"] }
rand.workspace = true
eyre.workspace = true
cfg-if.workspace = true
itertools.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
struct-reflection.workspace = true
powdr-openvm.workspace = true

[dev-dependencies]
openvm-stark-sdk = { workspace = true }
openvm-circuit = { workspace = true, features = ["test-utils"] }
test-case.workspace = true
itertools.workspace = true
powdr-openvm = { workspace = true }
autoprecompiles = { workspace = true }
powdr-autoprecompiles = { workspace = true }
powdr-number = { workspace = true }
pretty_assertions = "1"

[build-dependencies]
openvm-cuda-builder = { workspace = true, optional = true }

[features]
default = ["parallel", "jemalloc"]
parallel = ["openvm-circuit/parallel"]
test-utils = ["openvm-circuit/test-utils", "dep:openvm-stark-sdk"]
tco = ["openvm-circuit/tco"]
aot = ["openvm-circuit/aot", "openvm-circuit-derive/aot"]
# performance features:
mimalloc = ["openvm-circuit/mimalloc"]
jemalloc = ["openvm-circuit/jemalloc"]
jemalloc-prof = ["openvm-circuit/jemalloc-prof"]

cuda = [
  "dep:openvm-stark-sdk",
  "dep:openvm-cuda-common",
  "dep:openvm-cuda-backend",
  "dep:openvm-cuda-builder",
  "openvm-circuit-primitives/cuda",
  "openvm-circuit/cuda",
]
touchemall = [
  "cuda",
  "openvm-circuit/touchemall",
  "openvm-circuit-primitives/touchemall",
  "openvm-cuda-backend/touchemall",
  "openvm-cuda-common/touchemall",
]
