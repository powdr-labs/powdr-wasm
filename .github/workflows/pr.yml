name: PR Check

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main

# cancel any previous running workflows for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and Test
    if: github.event.pull_request.draft != true
    runs-on: warp-ubuntu-2404-x64-32x

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y wabt

      - name: Build project
        run: cargo build --release

      - name: Install Rust toolchain 1.91.1 (stable)
        run: |
          rustup install 1.91.1
          rustup +1.91.1 component add clippy
          rustup +1.91.1 component add rustfmt
          rustup +1.91.1 component add rust-src

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install nightly toolchain for OpenVM RISC-V guest builds
        # powdr-openvm-riscv invokes `cargo openvm build`, which pins to
        # nightly-2026-01-18 in openvm v2 (see powdr's
        # .github/actions/init-testing-instance/action.yml).
        run: |
          rustup toolchain install nightly-2026-01-18
          rustup component add rust-src --toolchain nightly-2026-01-18

      - name: Run tests
        run: cargo test --release

  clippy:
    name: Clippy
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y wabt

      - name: Install Rust toolchain 1.91.1 (stable)
        run: |
          rustup install 1.91.1
          rustup +1.91.1 component add clippy
          rustup +1.91.1 component add rustfmt
          rustup +1.91.1 component add rust-src

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

  gpu-tests:
    name: GPU Tests
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, gpu-shared]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GPU memory
        run: |
          FREE_MB=$(nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits)
          echo "Free GPU memory: ${FREE_MB} MiB"
          if [ "$FREE_MB" -lt 16000 ]; then
            echo "ERROR: Less than 16GB GPU memory free. Check for other GPU processes:"
            nvidia-smi
            exit 1
          fi

      - name: Install Rust toolchain 1.91.1 (stable)
        run: |
          rustup install 1.91.1
          rustup +1.91.1 component add clippy
          rustup +1.91.1 component add rustfmt
          rustup +1.91.1 component add rust-src

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Build project
        run: cargo build --release --features cuda

      - name: Run GPU ALU tests
        run: |
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_add --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_sub --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_xor --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_or --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_and --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_shl --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_shr_u --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_shr_s_imm --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_mul --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_div --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_divu --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_rems --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_remu --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_loadw --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_storew --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_loadb --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_loadh --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_storeb --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_storeh --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_u_true --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_u_false --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_u_equal --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_s_negative --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_u_imm --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_s_positive --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_s_both_negative --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_comparison_chain --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_u_64_true --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_u_64_false --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_s_64_negative --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_u_64_preserves_rd_high_word --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_s_64_preserves_rd_high_word --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_lt_u_64_false_preserves_rd_high_word --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_eq_true --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_eq_false --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_neq_true --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_neq_false --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_eq_imm --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_neq_imm --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_eq_64_true --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_eq_64_false --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_neq_64_true --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_neq_64_false --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_eq_64_preserves_rd_high_word --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_neq_64_preserves_rd_high_word --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_eq_64_false_preserves_rd_high_word --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_eq_imm_64 --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_neq_imm_64 --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_const32_small --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_const32_large --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_const32_zero --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_const32_max --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_input_hint --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_input_hint_with_frame_jump_and_xor --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_ret --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_call --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_call_indirect --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_call_and_return --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_jump --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_jump_if_true --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_jump_if_false --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_jump_if_zero_true --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_jump_if_zero_false --exact --test-threads=1
          cargo test --release --features cuda -- tests::isolated_tests::tests::test_skip --exact --test-threads=1

      - name: Run GPU keccak test
        run: |
          cargo test --release --features cuda -- tests::wasm_tests::test_keccak_rust_crush_1 --exact --test-threads=1
      
      - name: Run GPU apc test
        run: |
          cargo test --release --features cuda test_cli_prove_fib_with_1_apc
