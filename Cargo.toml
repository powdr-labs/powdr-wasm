[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["powdr-wasm", "extensions/openvm-transpiler", "extensions/crush-circuit", "guest-io", "extensions/autoprecompiles", "extensions/crush-translation"]
resolver = "2"

[workspace.dependencies]
powdr-openvm = { git = "https://github.com/powdr-labs/powdr.git", rev = "dc9561d", default-features = false, features = [
  "metrics",
] }
powdr-openvm-riscv = { git = "https://github.com/powdr-labs/powdr.git", rev = "dc9561d", default-features = false, features = [
  "metrics",
] }
powdr-autoprecompiles = { git = "https://github.com/powdr-labs/powdr.git", rev = "dc9561d", default-features = false }
powdr-number = { git = "https://github.com/powdr-labs/powdr.git", rev = "dc9561d", default-features = false }
powdr-riscv-elf = { git = "https://github.com/powdr-labs/powdr.git", rev = "dc9561d", default-features = false }

openvm-crush-transpiler = { path = "extensions/openvm-transpiler" }

crush-circuit = { path = "extensions/crush-circuit" }
autoprecompiles = { path = "extensions/autoprecompiles" }
crush-translation = { path = "extensions/crush-translation" }

openvm-stark-sdk = { git = "https://github.com/powdr-labs/stark-backend.git", tag = "v2.0.0-beta.2-powdr", features = [
  "parallel",
  "jemalloc",
  "metrics",
] }
openvm-stark-backend = { git = "https://github.com/powdr-labs/stark-backend.git", tag = "v2.0.0-beta.2-powdr", features = [
  "parallel",
  "jemalloc",
  "metrics",
] }
openvm-cuda-backend = { git = "https://github.com/powdr-labs/stark-backend.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-cuda-builder = { git = "https://github.com/powdr-labs/stark-backend.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-cuda-common = { git = "https://github.com/powdr-labs/stark-backend.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-sdk = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false, features = [
  "parallel",
  "jemalloc",
  "evm-prove",
  "metrics",
] }
openvm-circuit-primitives = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-circuit-primitives-derive = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-circuit = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-circuit-derive = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-instructions = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-instructions-derive = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-rv32im-transpiler = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-rv32im-circuit = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-transpiler = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-recursion-circuit = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-sdk-config = { git = "https://github.com/powdr-labs/openvm.git", tag = "v2.0.0-beta.2-powdr", default-features = false }
openvm-cpu-backend = { git = "https://github.com/powdr-labs/stark-backend.git", tag = "v2.0.0-beta.2-powdr", default-features = false }

thiserror = "1.0.65"
strum_macros = "0.26.4"
strum = { version = "0.26.3", features = ["derive"] }
derive-new = "0.6.0"
derive_more = { version = "1.0.0", features = [
  "display",
], default-features = false }
rand = { version = "0.9.2", default-features = false, features = ["std", "std_rng", "os_rng"] }
eyre = "0.6.12"
num-bigint = { version = "0.4.6", default-features = false }
num-integer = { version = "0.1.46", default-features = false }
serde = { version = "1.0.201", default-features = false, features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0"
struct-reflection = { git = "https://github.com/gzanitti/struct-reflection-rs.git" }
rustc-hash = "2.0.0"
cfg-if = "1.0.0"
test-case = "3.3.1"
itertools = "0.14"

rrs-lib = "0.1.0"
tracing = "0.1.40"

crush = { git = "https://github.com/powdr-labs/crush.git", rev = "330723c" }
wasmparser = { version = "0.235", default-features = false }

# TEMPORARY: redirect powdr-labs/openvm to the powdr-wasm-patch branch so CI
# can pick up the FP_AS-related GPU kernel fixes. Revert to the tag once a
# new tagged release of the powdr-labs/openvm fork is cut.
#
# The patched URL uses extra slashes (`https:///github.com//`) so cargo treats
# it as a different source from the original (cargo refuses to patch a source
# with the same canonical URL even if branch differs — known limitation, see
# rust-lang/cargo#5478, #5615, #10756). Git fetches the same repo either way.
[patch."https://github.com/powdr-labs/openvm.git"]
openvm-algebra-circuit = { git = "https:///github.com//powdr-labs/openvm", branch = "powdr-wasm-patch" }
openvm-algebra-complex-macros = { git = "https:///github.com//powdr-labs/openvm", branch = "powdr-wasm-patch" }
openvm-algebra-guest = { git = "https:///github.com//powdr-labs/openvm", branch = "powdr-wasm-patch" }
openvm-algebra-moduli-macros = { git = "https:///github.com//powdr-labs/openvm", branch = "powdr-wasm-patch" }
openvm-algebra-transpiler = { git = "https:///github.com//powdr-labs/openvm", branch = "powdr-wasm-patch" }
openvm-bigint-circuit = { git = "https:///github.com//powdr-labs/openvm", branch = "powdr-wasm-patch" }
openvm-bigint-guest = { git = "https:///github.com//powdr-labs/openvm", branch = "powdr-wasm-patch" }
openvm-bigint-transpiler = { git = "https:///github.com//powdr-labs/openvm", branch = "powdr-wasm-patch" }
openvm-build = { git = "https:///github.com//powdr-labs/openvm", branch = "powdr-wasm-patch" }
